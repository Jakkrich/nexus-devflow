name: Publish @jakkrichm/create-nexus-devflow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Validate DevFlow
        run: npm run check
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          node -e "const fs = require('node:fs'); const t = process.env.GITHUB_REF_NAME; const v1 = JSON.parse(fs.readFileSync('./packages/create-nexus-devflow/package.json', 'utf8')).version; const v2 = JSON.parse(fs.readFileSync('./packages/nexus-devflow/package.json', 'utf8')).version; if (t !== 'v' + v1 || v1 !== v2) { console.error('Tag ' + t + ' does not match package versions: core=' + v1 + ', unscoped=' + v2); process.exit(1); }"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_version=$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('./package.json', 'utf8')).version);")
          
          # 1. Publish core package (@jakkrichm/create-nexus-devflow)
          echo "Publishing @jakkrichm/create-nexus-devflow..."
          cd packages/create-nexus-devflow
          if npm view "@jakkrichm/create-nexus-devflow@$package_version" version >/dev/null 2>&1; then
            echo "@jakkrichm/create-nexus-devflow@$package_version is already published."
          else
            npm publish --access public
          fi
          cd ../..

          # 2. Publish unscoped CLI (nexus-devflow)
          echo "Publishing nexus-devflow..."
          cd packages/nexus-devflow
          if npm view "nexus-devflow@$package_version" version >/dev/null 2>&1; then
            echo "nexus-devflow@$package_version is already published."
          else
            npm publish --access public
          fi
          cd ../..

  release:
    if: github.ref_type == 'tag'
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
