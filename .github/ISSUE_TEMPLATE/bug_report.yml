name: Bug report
description: Report a reproducible problem with the Nexus-DevFlow installer or workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, private code, and personal data from every field and attachment.
  - type: checkboxes
    id: before-submitting
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: I confirmed the problem on the latest published version when practical.
          required: true
        - label: I removed secrets and private repository content from this report.
          required: true
  - type: input
    id: version
    attributes:
      label: Nexus-DevFlow version
      description: Run `npm view @jakkrichm/create-nexus-devflow version` or check `.nexus/nexus-devflow.json`.
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: AI tool and adapter family
      options:
        - Codex (.agents adapter)
        - Google Antigravity (shared .agents adapter)
        - Claude Code
        - Both adapter families
        - Other or manual SKILL.md usage
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Node.js version, and AI coding tool version.
      placeholder: Windows 11, Node.js 22.17.0, Google Antigravity 2.x
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its effect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Explain how to reproduce the issue from a fresh project or clean state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Command output or log snippet
      description: Paste exact error messages or command output. Keep output unedited.
      render: text
