<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1510" role="img" aria-labelledby="title description">
  <title id="title">Nexus-DevFlow Core Workflow (Mobile)</title>
  <desc id="description">Plan the project, compile context, specify one task-isolated work item, implement it with TDD, verify it with empirical proof, and complete it to history. Fix issues by returning to implementation, then repeat for the next work item. Brief, prototype, debug, and rollback are optional companion tools.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#dce8ec" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#15342a" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2161e8"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 16px; font-weight: 800; letter-spacing: 0.14em; }
      .stage { font-size: 15px; font-weight: 800; letter-spacing: 0.11em; }
      .command { font-size: 32px; font-weight: 800; }
      .body { font-size: 18px; font-weight: 600; }
      .artifact { font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect x="1" y="1" width="718" height="1508" rx="28" fill="#f7f9f7" stroke="#d5dfda" stroke-width="2"/>
  <rect x="1" y="1" width="718" height="1508" rx="28" fill="url(#grid)" opacity="0.72"/>

  <g class="sans">
    <text x="42" y="55" class="eyebrow" fill="#2161e8">NEXUS-DEVFLOW CORE WORKFLOW</text>
    <text x="42" y="99" font-size="32" font-weight="800" fill="#17241f">Plan changes, then repeat the work loop.</text>
    <text x="42" y="133" class="body" fill="#65716c">Overview is not required before every feature.</text>
    <g transform="translate(42 155)">
      <rect width="238" height="40" rx="20" fill="#edf2ef" stroke="#b8c8c0"/>
      <text x="119" y="26" class="mono artifact" text-anchor="middle" fill="#42534c">/onboard or /adopt</text>
    </g>

    <text x="42" y="226" class="stage" fill="#65716c">RUN WHEN PLANS CHANGE</text>
    <text x="42" y="606" class="stage" fill="#2161e8">REPEAT FOR EACH WORK ITEM</text>

    <path d="M 360 360 V 394" stroke="#2161e8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 360 520 V 614" stroke="#2161e8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 360 740 V 774" stroke="#2161e8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 360 900 V 934" stroke="#2161e8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 360 1060 V 1124" stroke="#2161e8" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- 01 PLAN -->
    <g transform="translate(42 240)" filter="url(#shadow)">
      <rect width="636" height="120" rx="18" fill="#ffffff" stroke="#aebfb6" stroke-width="2"/>
      <text x="24" y="31" class="stage" fill="#65716c">01  PLAN</text>
      <text x="24" y="72" class="command" fill="#17241f">Plan</text>
      <text x="210" y="52" class="body" fill="#52605a">Define the product and ordered work.</text>
      <rect x="210" y="69" width="394" height="34" rx="9" fill="#eef3ff" stroke="#b8c9f4"/>
      <text x="407" y="91" class="mono artifact" text-anchor="middle" fill="#274a91">project-plan.md + build-plan.md</text>
    </g>

    <!-- 02 CONTEXT -->
    <g transform="translate(42 400)" filter="url(#shadow)">
      <rect width="636" height="120" rx="18" fill="#2161e8" stroke="#1247ad" stroke-width="2"/>
      <text x="24" y="31" class="stage" fill="#bed1ff">02  CONTEXT</text>
      <text x="24" y="72" class="mono command" fill="#ffffff">/overview</text>
      <text x="236" y="52" class="body" fill="#e2eaff">Compile living project context.</text>
      <rect x="236" y="69" width="368" height="34" rx="9" fill="#174fca" stroke="#6e9cff"/>
      <text x="420" y="91" class="mono artifact" text-anchor="middle" fill="#ffffff">project-overview.md</text>
    </g>

    <!-- 03 SPECIFY -->
    <g transform="translate(42 620)" filter="url(#shadow)">
      <rect width="636" height="120" rx="18" fill="#2161e8" stroke="#1247ad" stroke-width="2"/>
      <text x="24" y="31" class="stage" fill="#bed1ff">03  SPECIFY</text>
      <text x="24" y="72" class="mono command" fill="#ffffff">/feature</text>
      <text x="236" y="52" class="body" fill="#e2eaff">Use /fix for an unplanned change.</text>
      <rect x="236" y="69" width="368" height="34" rx="9" fill="#174fca" stroke="#6e9cff"/>
      <text x="420" y="91" class="mono artifact" text-anchor="middle" fill="#ffffff">spec.md (Living Spec)</text>
    </g>

    <!-- 04 BUILD -->
    <g transform="translate(42 780)" filter="url(#shadow)">
      <rect width="636" height="120" rx="18" fill="#2161e8" stroke="#1247ad" stroke-width="2"/>
      <text x="24" y="31" class="stage" fill="#bed1ff">04  BUILD</text>
      <text x="24" y="72" class="mono command" fill="#ffffff">/implement</text>
      <text x="256" y="52" class="body" fill="#e2eaff">Build in small, TDD verified steps.</text>
      <rect x="256" y="69" width="348" height="34" rx="9" fill="#174fca" stroke="#6e9cff"/>
      <text x="430" y="91" class="mono artifact" text-anchor="middle" fill="#ffffff">working code + tests</text>
    </g>

    <!-- 05 VERIFY -->
    <g transform="translate(42 940)" filter="url(#shadow)">
      <rect width="636" height="120" rx="18" fill="#fff7e7" stroke="#e0b65e" stroke-width="2"/>
      <text x="24" y="31" class="stage" fill="#9b6a17">05  VERIFY</text>
      <text x="24" y="72" class="mono command" fill="#2f2a1e">/check</text>
      <text x="210" y="52" class="body" fill="#6d6045">Optional: /check guide + /audit</text>
      <rect x="210" y="69" width="394" height="34" rx="9" fill="#fffdf7" stroke="#e5c887"/>
      <text x="407" y="91" class="mono artifact" text-anchor="middle" fill="#76551b">evidence + findings</text>
    </g>

    <!-- Loop alert -->
    <g transform="translate(170 1072)">
      <rect width="380" height="38" rx="19" fill="#f7f9f7" stroke="#2161e8" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="190" y="25" class="stage" text-anchor="middle" fill="#2161e8">ISSUES? RETURN TO /IMPLEMENT</text>
    </g>

    <!-- 06 COMPLETE -->
    <g transform="translate(42 1130)" filter="url(#shadow)">
      <rect width="636" height="120" rx="18" fill="#2161e8" stroke="#1247ad" stroke-width="2"/>
      <text x="24" y="31" class="stage" fill="#bed1ff">06  COMPLETE</text>
      <text x="24" y="72" class="mono command" fill="#ffffff">/complete</text>
      <text x="256" y="52" class="body" fill="#e2eaff">Archive, commit, and squash-merge.</text>
      <rect x="256" y="69" width="348" height="34" rx="9" fill="#174fca" stroke="#6e9cff"/>
      <text x="430" y="91" class="mono artifact" text-anchor="middle" fill="#ffffff">history/</text>
    </g>

    <text x="360" y="1292" class="stage" text-anchor="middle" fill="#2161e8">NEXT WORK ITEM STARTS AGAIN AT /FEATURE</text>

    <!-- Optional Companions -->
    <g transform="translate(42 1320)">
      <rect width="636" height="142" rx="20" fill="#ffffff" stroke="#bdcbc4" stroke-width="2"/>
      <text x="22" y="31" class="stage" fill="#65716c">OPTIONAL, WHEN NEEDED</text>
      <g class="mono artifact" text-anchor="middle">
        <g transform="translate(22 49)">
          <rect width="138" height="34" rx="10" fill="#eef3ff" stroke="#b8c9f4"/>
          <text x="69" y="22" fill="#244b9d">/brief</text>
        </g>
        <g transform="translate(174 49)">
          <rect width="138" height="34" rx="10" fill="#eef3ff" stroke="#b8c9f4"/>
          <text x="69" y="22" fill="#244b9d">/prototype</text>
        </g>
        <g transform="translate(326 49)">
          <rect width="138" height="34" rx="10" fill="#eef3ff" stroke="#b8c9f4"/>
          <text x="69" y="22" fill="#244b9d">/debug</text>
        </g>
        <g transform="translate(478 49)">
          <rect width="138" height="34" rx="10" fill="#eef3ff" stroke="#b8c9f4"/>
          <text x="69" y="22" fill="#244b9d">/rollback</text>
        </g>
      </g>
      <text x="318" y="116" class="body" text-anchor="middle" fill="#65716c">Not part of every run.</text>
    </g>
  </g>
</svg>
